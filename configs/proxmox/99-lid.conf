# /etc/systemd/logind.conf.d/99-lid.conf
#
# Run a laptop as a headless server: never suspend on lid close, on any
# power source, docked or not. Apply with: systemctl restart systemd-logind
# (no secrets here, so this is committed as-is, not a .sample).

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
